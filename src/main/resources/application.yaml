spring:
  application:
    name: student-management
  jpa:
    show-sql: true
  h2:
    console.enabled: true
    console:
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:dcbapp
    driver-class-name: org.h2.Driver
    username: sa
    password:
    jpa:
      spring.jpa.database-platform: org.hibernate.dialect.H2Dialect